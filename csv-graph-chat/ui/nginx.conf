server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow up to 200 MB uploads (prevents nginx returning HTML 413 error)
    client_max_body_size 200M;

    # Proxy API calls — avoids CORS issues entirely
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Forward errors as-is (don't intercept and convert to nginx HTML pages)
        proxy_intercept_errors off;

        # Make sure JSON content-type passes through
        proxy_set_header   Accept "application/json";
    }

    # Static files with cache busting
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json;
}
